name: Deploy to IONOS

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install lftp
        run: sudo apt-get update -qq && sudo apt-get install -y -qq lftp

      - name: Deploy via SFTP
        env:
          SFTP_SERVER: ${{ secrets.SFTP_SERVER }}
          SFTP_USERNAME: ${{ secrets.SFTP_USERNAME }}
          SFTP_PASSWORD: ${{ secrets.SFTP_PASSWORD }}
        run: |
          # Destino: carpeta /public del webspace (la que IONOS asocia a zxconsulting.solutions).
          # Ruta relativa al home de la cuenta SFTP, sin "/" inicial.
          lftp -u "$SFTP_USERNAME","$SFTP_PASSWORD" "sftp://$SFTP_SERVER:22" <<'LFTP'
          set sftp:auto-confirm yes
          set net:max-retries 3
          mirror -R --verbose \
            --exclude-glob .git/ --exclude-glob .github/ --exclude-glob .gitignore \
            --exclude-glob README.md \
            ./ ./public/
          bye
          LFTP
