name: Deploy to IONOS

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Deploy via SFTP
        uses: wlixcc/SFTP-Deploy-Action@v1.2.4
        with:
          server: ${{ secrets.SFTP_SERVER }}
          username: ${{ secrets.SFTP_USERNAME }}
          password: ${{ secrets.SFTP_PASSWORD }}
          port: 22
          local_path: './*'
          # Ruta relativa al home de la cuenta SFTP (nunca con "/" inicial).
          # Debe ser la carpeta que IONOS asocia a zxconsulting.solutions.
          remote_path: './zxconsulting/'
          sftp_only: true
